:var(--top)}.bottom{bottom:0;left:0;right:0;height:var(--bottom)}.left{left:0;top:var(--top);bottom:var(--bottom);width:var(--side)}.right{right:0;top:var(--top);bottom:var(--bottom);width:var(--side)}.safe{position:absolute;top:var(--top);bottom:var(--bottom);left:var(--side);right:var(--side);border:1px dashed #a5f0b5;display:flex;justify-content:center;align-items:center;color:#b6f6c3;text-align:center;font-size:10px;text-shadow:0 1px 4px black}.overlay[hidden],.hidden{display:none!important}.stage-note{font-size:10px;color:#777;margin:13px 0 0;line-height:1.6}.drop{display:block;background:var(--field);border:1px dashed #555;text-align:center;padding:30px 15px;cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:var(--yellow);background:#22200f}.drop strong{display:block;color:#fff;margin-bottom:10px}.drop span{color:#888;font-size:11px}.drop input{display:none}.group{margin-top:26px}label.caption{display:block;font:normal 15px var(--display);text-transform:uppercase;margin-bottom:12px;color:#fff}.choices{display:flex;gap:8px}.choice{flex:1;padding:14px 8px;border:1px solid var(--border);background:var(--field);color:#aaa;text-transform:uppercase}.choice.active{background:var(--yellow);color:#000;border-color:var(--yellow);font-weight:700}.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:13px 0;color:#bbb}.setting input[type=checkbox]{accent-color:var(--yellow);width:18px;height:18px}.setting input[type=range]{accent-color:var(--yellow);width:50%}.setting select{background:#191919;border:1px solid #444;color:#fff;padding:9px;max-width:65%}.rule{height:1px;background:var(--border);margin:24px 0}.results{background:#161616;border:1px solid #292929;padding:15px;line-height:1.9}.result-row{display:flex;justify-content:space-between;gap:14px;overflow-wrap:anywhere}.result-row span:first-child{color:#888}.ok{color:var(--green)}.warn{color:var(--red)}.neutral{color:#aaa}.buttons{display:flex;gap:10px;margin-top:18px}.primary,.secondary{border:0;padding:16px 12px;text-transform:uppercase;font-family:var(--display);font-size:12px}.primary{background:var(--yellow);color:#000;flex:2}.secondary{background:transparent;border:1px solid #444;color:#aaa;flex:1}.primary:disabled{opacity:.35;cursor:not-allowed}.message{font-size:11px;line-height:1.7;color:#aaa;margin-top:15px;min-height:20px}.footer{margin-top:25px;font-size:10px;color:#777;line-height:1.8}code{color:var(--yellow)}.peek{position:absolute;z-index:4;top:12px;right:12px;background:#161616e8;border:1px solid #555;color:#eee;padding:9px 11px;font-size:10px;font-weight:700;user-select:none;touch-action:none}.peek:disabled{opacity:.3;cursor:not-allowed}.peek:not(:disabled):active{background:var(--yellow);color:#000}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:18px}.footer a{color:var(--yellow);text-decoration:none}.footer a:hover{text-decoration:underline}@media(max-width:820px){main{padding:32px 14px}.workspace{grid-template-columns:1fr}.panel{padding:18px}.stage{min-height:440px}.frame{width:min(100%,240px)}}

<body><main><header><h1>SAFE ZONE CHECKER</h1></header>
<div class="workspace"><section class="panel"><label class="drop" id="drop" tabindex="0" role="button"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm"><strong>↑ ARRASTE OU SELECIONE UM ARQUIVO</strong><span>JPG, PNG, WEBP, MP4, MOV, WEBM</span></label><div class="group"><label class="caption">Selecione o tipo</label><div class="choices"><button type="button" class="choice active" data-mode="stories">Stories</button><button type="button" class="choice" data-mode="reels">Reels</button></div></div><div class="group"><div class="setting"><span>Mostrar safe zone</span><input id="showOverlay" type="checkbox" checked aria-label="Mostrar safe zone"></div><div class="setting"><span>Opacidade</span><input id="opacity" type="range" min="10" max="85" value="42" aria-label="Opacidade do overlay"><span id="opacityValue">42%</span></div></div><h2 class="panel-title">DIAGNÓSTICO</h2><div class="results"><div class="result-row"><span>Resolução</span><span id="resolution" class="neutral">—</span></div><div class="result-row"><span>Proporção 9:16</span><span id="ratio" class="neutral">—</span></div><div class="result-row"><span>Área segura</span><span id="safeResolution" class="neutral">—</span></div><div class="result-row"><span>Tamanho</span><span id="filesize" class="neutral">—</span></div><div class="result-row"><span>Formato</span><span id="format" class="neutral">—</span></div></div><div class="buttons"><button class="primary" id="export" disabled>Exportar preview</button><button class="secondary" id="clear">Limpar</button></div><button type="button" class="guide-download" id="downloadGuides">Baixar guia PNG</button><div id="message" class="message" role="status" aria-live="polite"></div></section><section class="panel"><div class="stage"><div class="frame" id="frame"><div id="empty" class="empty"></div><img id="photo" alt="Prévia da peça" hidden><video id="movie" controls playsinline hidden></video><div id="overlay" class="overlay" style="--top:14%;--bottom:20%;--side:5%;--alpha:.42"><div class="hazard top"></div><div class="hazard bottom"></div><div class="hazard left"></div><div class="hazard right"></div><div class="safe"><span class="safe-name">ÁREA SEGURA</span><span class="safe-dim" id="safeDim"></span></div><span class="risk-label risk-top">ÁREA DE RISCO</span><span class="risk-label risk-bottom">ÁREA DE RISCO</span></div></div></div></section></div>
<footer class="footer"><span>SAFE ZONE CHECKER / V1.6 · GUIAS VISUAIS DE REFERÊNCIA, NÃO CERTIFICAÇÃO OFICIAL.</span><a href="https://www.facebook.com/business/ads/facebook-instagram-reels-ads" target="_blank" rel="noopener noreferrer">FONTE: META FOR BUSINESS ↗</a></footer></main>
<script>
'use strict';
// Percentuais conservadores de visualização, NÃO especificações oficiais universais.
// Revise estes valores contra a documentação Meta vigente antes de usar em campanhas.
const PRESETS={stories:{organic:{top:14,bottom:20,side:5},ad:{top:14,bottom:20,side:5}},reels:{organic:{top:14,bottom:35,side:6},ad:{top:14,bottom:35,side:6}}};
const REFERENCE_WIDTH=1080,REFERENCE_HEIGHT=1920;
const $=id=>document.getElementById(id);let mode='stories',file=null,url=null,mediaWidth=0,mediaHeight=0,mediaType='';
const photo=$('photo'),movie=$('movie');
function status(msg){$('message').textContent=msg?'// '+msg:''}
function preset(){const p=PRESETS[mode].organic;$('overlay').style.setProperty('--top',p.top+'%');$('overlay').style.setProperty('--bottom',p.bottom+'%');$('overlay').style.setProperty('--side',p.side+'%');updateSafeDimensions();}
function info(id,value,cls='neutral'){$(id).textContent=value;$(id).className=cls}
function resetMedia(){movie.pause();movie.removeAttribute('src');movie.load();photo.removeAttribute('src');photo.hidden=true;movie.hidden=true;$('empty').hidden=false;if(url)URL.revokeObjectURL(url);url=null;file=null;mediaWidth=mediaHeight=0;mediaType='';$('export').disabled=true;['resolution','ratio','filesize','format','safeResolution'].forEach(id=>info(id,'—'));$('safeDim').textContent='';}
function updateSafeDimensions(){if(!mediaWidth||!mediaHeight){$('safeDim').textContent='';info('safeResolution','—');return}const p=PRESETS[mode].organic;const w=Math.round(REFERENCE_WIDTH*(1-2*p.side/100));const h=Math.round(REFERENCE_HEIGHT*(1-(p.top+p.bottom)/100));const dimensions=w+' × '+h+' px';$('safeDim').textContent=dimensions;info('safeResolution',dimensions+' (base 1080 × 1920)','ok')}
function diagnose(){updateSafeDimensions();info('resolution',mediaWidth+' × '+mediaHeight);const is916=Math.abs(mediaWidth/mediaHeight-9/16)<.003;info('ratio',is916?'OK':'FORA DE 9:16',is916?'ok':'warn');info('format',mediaType==='image'?'IMAGEM':'VÍDEO','ok');$('export').disabled=false;status(is916?'':'Proporção diferente de 9:16. Revise antes de publicar.');}
async function loadFile(f){if(!f)return;resetMedia();const ext=(f.name.split('.').pop()||'').toLowerCase();const image=['jpg','jpeg','png','webp'].includes(ext),video=['mp4','mov','webm'].includes(ext);if(!image&&!video){status('Formato não suportado.');return}file=f;mediaType=image?'image':'video';info('filesize',(f.size/1048576).toFixed(2)+' MB');url=URL.createObjectURL(f);$('empty').hidden=true;if(image){photo.hidden=false;photo.onload=()=>{mediaWidth=photo.naturalWidth;mediaHeight=photo.naturalHeight;diagnose()};photo.onerror=()=>{resetMedia();status('Não foi possível abrir esta imagem.')};photo.src=url}else{movie.hidden=false;movie.onloadedmetadata=()=>{mediaWidth=movie.videoWidth;mediaHeight=movie.videoHeight;diagnose()};movie.onerror=()=>{resetMedia();status('Este navegador não consegue reproduzir o vídeo. MOV/HEVC pode exigir conversão para MP4 H.264.')};movie.src=url;movie.load()} }
$('file').addEventListener('change',e=>loadFile(e.target.files[0]));const drop=$('drop');drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));preset()}));$('showOverlay').addEventListener('change',e=>$('overlay').hidden=!e.target.checked);$('opacity').addEventListener('input',e=>{$('overlay').style.setProperty('--alpha',e.target.value/100);$('opacityValue').textContent=e.target.value+'%'});$('clear').addEventListener('click',()=>{resetMedia();$('file').value='';status('')});
$('export').addEventListener('click',async()=>{if(!file||!mediaWidth)return;try{const canvas=document.createElement('canvas');canvas.width=mediaWidth;canvas.height=mediaHeight;const ctx=canvas.getContext('2d');ctx.fillStyle='#111';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(mediaType==='image'?photo:movie,0,0,canvas.width,canvas.height);if($('showOverlay').checked){const p=PRESETS[mode].organic,w=canvas.width,h=canvas.height,t=h*p.top/100,b=h*p.bottom/100,s=w*p.side/100;ctx.fillStyle=`rgba(255,74,74,${$('opacity').value/100})`;ctx.fillRect(0,0,w,t);ctx.fillRect(0,h-b,w,b);ctx.fillRect(0,t,s,h-t-b);ctx.fillRect(w-s,t,s,h-t-b);ctx.strokeStyle='#a5f0b5';ctx.lineWidth=Math.max(2,w/500);ctx.setLineDash([w/100,w/130]);ctx.strokeRect(s,t,w-2*s,h-t-b);ctx.setLineDash([]);const fs=Math.max(12,Math.round(w*.023));ctx.font='bold '+fs+'px JetBrains Mono, monospace';ctx.textAlign='center';ctx.fillStyle='#c4ffd4';ctx.shadowColor='#000';ctx.shadowBlur=fs*.45;ctx.fillText('ÁREA SEGURA',w/2,t+(h-t-b)/2-fs*.4);ctx.fillText(Math.round(REFERENCE_WIDTH*(1-2*p.side/100))+' × '+Math.round(REFERENCE_HEIGHT*(1-(p.top+p.bottom)/100))+' px',w/2,t+(h-t-b)/2+fs*.95);ctx.fillStyle='#fff';ctx.font=Math.max(11,Math.round(fs*.85))+'px JetBrains Mono, monospace';ctx.fillText('ÁREA DE RISCO',w/2,t/2);ctx.fillText('ÁREA DE RISCO',w/2,h-b/2);ctx.shadowBlur=0}canvas.toBlob(blob=>{if(!blob){status('Falha ao exportar a prévia.');return}const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='safe-zone-'+mode+'-'+file.name.replace(/\.[^.]+$/,'')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status('Prévia PNG exportada com sucesso.')},'image/png')}catch(e){status('Não foi possível exportar este quadro de vídeo. Tente pausar o vídeo e exportar novamente.')}});
// Exporta somente as guias, sem arte, em PNG RGBA 1080 × 1920.
// A transparência é fixa e independe do controle de opacidade do preview.
$('downloadGuides').addEventListener('click',async()=>{
  const p=PRESETS[mode].organic;
  const canvas=document.createElement('canvas');
  canvas.width=REFERENCE_WIDTH;
  canvas.height=REFERENCE_HEIGHT;
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  const top=h*p.top/100,bottom=h*p.bottom/100,side=w*p.side/100;
  // Não pintar o fundo: a área segura permanece 100% transparente.
  ctx.fillStyle='rgba(255,74,74,0.42)';
  ctx.fillRect(0,0,w,top);
  ctx.fillRect(0,h-bottom,w,bottom);
  ctx.fillRect(0,top,side,h-top-bottom);
  ctx.fillRect(w-side,top,side,h-top-bottom);
  ctx.strokeStyle='#a5f0b5';
  ctx.lineWidth=3;
  ctx.setLineDash([12,9]);
  ctx.strokeRect(side,top,w-2*side,h-top-bottom);
  ctx.setLineDash([]);
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='bold 23px "JetBrains Mono",monospace';
  ctx.fillStyle='#ffffff';
  ctx.shadowColor='rgba(0,0,0,.85)';
  ctx.shadowBlur=6;
  ctx.fillText('ÁREA DE RISCO',w/2,top/2);
  ctx.fillText('ÁREA DE RISCO',w/2,h-bottom/2);
  // Etiqueta dentro da área segura; sem preenchimento de fundo.
  const safeHeight=h-top-bottom;
  ctx.fillStyle='#b6f6c3';
  ctx.fillText('ÁREA SEGURA',w/2,top+safeHeight/2-18);
  ctx.font='20px "JetBrains Mono",monospace';
  ctx.fillText(Math.round(w-2*side)+' × '+Math.round(safeHeight)+' px',w/2,top+safeHeight/2+18);
  ctx.shadowBlur=0;
  try{
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob)throw new Error('PNG não gerado');
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=u;
    a.download='safe-zone-guias-'+mode+'-1080x1920.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1500);
    status('Guias PNG transparentes exportadas (1080 × 1920 px).');
  }catch(err){status('Não foi possível baixar as guias PNG.');}
});
// Ajusta o título à largura REAL da coluna de controles, não à viewport.
function fitTitle(){
  const title=document.querySelector('h1');
  const header=document.querySelector('header');
  if(!title||!header)return;
  if(window.innerWidth<=820){title.style.removeProperty('font-size');return;}
  const available=header.getBoundingClientRect().width;
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const style=getComputedStyle(title);
  const text=title.textContent.trim();
  const spacing=parseFloat(style.letterSpacing)||0;
  let low=10,high=49;
  for(let i=0;i<22;i++){
    const mid=(low+high)/2;
    ctx.font=`${style.fontWeight} ${mid}px ${style.fontFamily}`;
    const width=ctx.measureText(text).width+Math.max(0,text.length-1)*spacing;
    if(width<=available-2)low=mid;else high=mid;
  }
  title.style.fontSize=low.toFixed(2)+'px';
}
window.addEventListener('resize',fitTitle);
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fitTitle)}
fitTitle();
preset();
</script></body></html>
